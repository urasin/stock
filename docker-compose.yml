services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: >
      bash -c "rm -f tmp/pids/server.pid &&
      bin/rails db:prepare &&
      bin/rails server -b 0.0.0.0 -p $${RAILS_PORT:-3333}"
    environment:
      PORT: ${RAILS_PORT:-3333}
      RAILS_PORT: ${RAILS_PORT:-3333}
    ports:
      - "${WEB_PORT:-3333}:${RAILS_PORT:-3333}"
    volumes:
      - .:/rails
      - stock_storage:/rails/storage
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:$${RAILS_PORT:-3333}/up"]
      interval: 10s
      timeout: 5s
      retries: 5
    tty: true
    stdin_open: true

volumes:
  stock_storage:
